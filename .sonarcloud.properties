# Périmètre de l'analyse automatique SonarQube Cloud. Ce fichier n'accepte que des chemins
# simples, sans joker (doc « Automatic analysis »), et sources et tests doivent être disjoints.
# Sources : les 44 fichiers déjà indexés au 29/09/2026 (api/measures/component_tree).
# Un nouveau dossier ou fichier de code à la racine doit être ajouté ici pour être analysé.
sonar.sources=src,scripts,_locales,manifest.json,manifest.firefox.json
# Tests Node (scripts/run-tests.sh), analysés comme du code de test
sonar.tests=tests
