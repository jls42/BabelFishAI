# Pre-commit hooks configuration for BabelFishAI (Chrome/Firefox extension).
# Install:
#   pipx install pre-commit         # or `pip install pre-commit`
#   pre-commit install                          # commit-time hooks
#   pre-commit install --hook-type pre-push     # heavy gates (SAST, complexity)
# Manual run:
#   pre-commit run --all-files                            # all commit-time hooks
#   pre-commit run --hook-stage pre-push --all-files      # all pre-push hooks

repos:
    # Shellcheck — bash linter (Python wrapper, no Docker required)
    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1-1
      hooks:
          - id: shellcheck
            # severity=warning: info-level findings (SC2317, SC2012) are often
            # false positives or stylistic nits unrelated to correctness.
            args: ['--severity=warning', '-x']

    # Prettier — formatting for JSON/YAML/MD/HTML/CSS/JS
    # Local hook: pre-commit/mirrors-prettier is archived (April 2024) and its last stable tag is
    # v3.1.0. The definition below is the mirror's own (.pre-commit-hooks.yaml), with an exact
    # prettier version from npm.
    # language_version: system uses the Node already required by the tests (22+). Otherwise
    # pre-commit ignores a Node installed under the home directory (nvm) and has nodeenv download
    # the "latest" one, which failed on 2026-11-06: nodeenv cannot parse v27.0.0-alpha.0.0.0.
    - repo: local
      hooks:
          - id: prettier
            name: prettier
            entry: prettier --write --ignore-unknown
            language: node
            language_version: system
            types: [text]
            require_serial: false
            additional_dependencies: ['prettier@3.9.10']
            files: \.(json|yaml|yml|md|html|css|js|mjs)$
            # Mirrors .prettierignore but expressed as regex (pre-commit limitation).
            exclude: |
                (?x)^(
                  src/lib/.*|
                  dist/.*|
                  _locales/.*|
                  node_modules/.*|
                  README-[a-z]{2}\.md|
                  tests/snapshots/.*|
                  .*\.min\.js
                )$

    # pre-commit/pre-commit-hooks — basic hygiene checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            exclude: \.md$
          - id: end-of-file-fixer
            exclude: \.md$
          - id: check-yaml
          - id: check-json
            exclude: |
                (?x)^(
                  _locales/.*\.json|
                  \.secrets\.baseline
                )$
          - id: check-added-large-files
            args: ['--maxkb=500']
          - id: check-merge-conflict
          - id: mixed-line-ending
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable

    # Yelp/detect-secrets — block accidental API key / token leaks
    - repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
          - id: detect-secrets
            args: ['--baseline', '.secrets.baseline']
            # MUST match the --exclude-files used to generate .secrets.baseline.
            exclude: |
                (?x)^(
                  src/lib/browser-polyfill\.min\.js|
                  \.secrets\.baseline
                )$

    # Local hooks — heavy gates (SAST, complexity) run only on pre-push.
    - repo: local
      hooks:
          # Opengrep/Semgrep SAST scan (~30s). Skip gracefully if tool absent locally.
          - id: check-security-sast
            name: Opengrep/Semgrep SAST scan
            entry: scripts/check-security-sast.sh
            language: system
            pass_filenames: false
            stages: [pre-push]

          # Lizard cyclomatic complexity + length thresholds.
          - id: check-complexity
            name: Lizard complexity gate (CCN <= 20, length <= 1500)
            entry: scripts/check-complexity.sh
            language: system
            pass_filenames: false
            stages: [pre-push]

          # Node test suite (node --test, < 1 s). Skipped with a warning without Node 22+.
          - id: run-tests
            name: Node tests (scripts/run-tests.sh)
            entry: scripts/run-tests.sh
            language: system
            pass_filenames: false
            stages: [pre-push]
